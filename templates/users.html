{% extends "base.html" %}
{% block content %}

<h1 class="mb-4">User List</h1>

<div class="mb-3">
    <a href="/add_user"
       style="
            display: inline-flex;
            align-items: center;
            padding: 8px 10px;
            background:#3ab2fc;
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 300;
       ">
        <i class="bi bi-plus-lg" style="margin-right: 6px;"></i>
        Create New User
    </a>
</div>

<table class="table table-striped table-bordered align-middle">
    <thead class="table-light">
        <tr>
            <th>UserID</th>
            <th>Name</th>
            <th>Date_of_Birth</th>
            <th>Height</th>
            <th>Weight</th>
        </tr>
    </thead>

    <tbody>
        {% for u in users %}
        <tr>
            <td>{{ u.UserID }}</td>
            <td>
                <a href="/user/{{ u.UserID }}">
                    {{ u.Name }}
                </a>
            </td>
            <td>{{ u.Date_of_Birth }}</td>
            <td>{{ u.Height }}</td>
            <td>{{ u.Weight }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
