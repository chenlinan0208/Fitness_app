{% extends "base.html" %}
{% block content %}


<!DOCTYPE html>
<html>
<head>
    <title>Nutrition Logs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="p-4">

    <h1>Nutrition Logs</h1>

    <a href="/user/{{ user_id }}" class="btn btn-secondary mb-3">Back to User</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>Log ID</th>
                <th>Date</th>
                <th>Calories</th>
                <th>Macros</th>
            </tr>
        </thead>

        <tbody>
            {% for row in logs %}
            <tr>
                <td>{{ row.NutritionLogID }}</td>
                <td>{{ row.Date }}</td>
                <td>{{ row.Calorie_intake }}</td>
                <td>{{ row.Macros }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
{% endblock %}
