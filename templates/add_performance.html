{% extends "base.html" %}
{% block content %}
<div class="container mt-4" style="max-width: 700px;">
  <h2 class="mb-4">Add Performance Log</h2>

  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Date</label>
      <input type="date" name="date" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Duration (min)</label>
      <input type="number" name="duration" class="form-control" required>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Sets</label>
        <input type="number" name="sets" class="form-control" required>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Reps</label>
        <input type="number" name="reps" class="form-control" required>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Weight (kg)</label>
        <input type="number" step="0.1" name="weight" class="form-control" required>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Exercise</label>
      <select name="workout_id" class="form-select" required>
        <option value="" disabled selected>Select workout</option>
        {% for ex in exercises %}
          <option value="{{ ex.WorkoutId }}" data-exid="{{ ex.ExerciseID }}">
            [W{{ ex.WorkoutId }}] {{ ex.Exercise_Name }} ({{ ex.Category }})
          </option>
        {% endfor %}
      </select>
      <input type="hidden" name="exercise_id" id="exercise_id">
    </div>

    <div class="d-flex justify-content-between mt-4">
      <a href="{{ url_for('performance_logs', user_id=user_id) }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>

<script>
  const select = document.querySelector('select[name="workout_id"]');
  const exInput = document.getElementById('exercise_id');
  if (select) {
    select.addEventListener('change', function() {
      const opt = this.options[this.selectedIndex];
      exInput.value = opt.getAttribute('data-exid');
    });
  }
</script>
{% endblock %}
