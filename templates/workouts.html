{% extends "base.html" %}
{% block content %}

<div class="container py-4" style="max-width: 1100px;">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold">Workouts</h1>
        <a href="{{ url_for('create_workout') }}" class="btn btn-primary">
            + Create New Workout
        </a>
    </div>

    <!-- Filters (optional, not functional yet) -->
    <div class="d-flex gap-3 mb-3">
        <select class="form-select w-auto">
            <option selected>All Users</option>
        </select>

        <select class="form-select w-auto">
            <option selected>All Dates</option>
        </select>
    </div>

    <!-- Workouts Table -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>WorkoutID</th>
                        <th>User</th>
                        <th>Date</th>
                        <th>Duration</th>
                        <th>Total Volume</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for w in workouts %}
                    <tr>
                        <td>{{ w.WorkoutID }}</td>
                        <td>{{ w.UserName }}</td>
                        <td>{{ w.Date }}</td>
                        <td>{{ w.TotalDuration }} min</td>
                        <td>{{ w.TotalVolume }}</td>
                        <td>
                            <a href="{{ url_for('workout_detail', user_id=w.UserID, date=w.Date) }}" 
                               class="btn btn-sm btn-outline-primary">View</a>

                            <form action="{{ url_for('delete_workout') }}" method="POST" class="d-inline">
                                <input type="hidden" name="user_id" value="{{ w.UserID }}">
                                <input type="hidden" name="date" value="{{ w.Date }}">
                                <button class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this workout?')">
                                    Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</div>

{% endblock %}
