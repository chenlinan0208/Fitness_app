{% extends "base.html" %}
{% block content %}

<div class="container py-4" style="max-width: 1100px;">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold">Workouts</h1>
        <a href="{{ url_for('create_workout') }}" class="btn btn-primary">
            + Create New Workout
        </a>
    </div>

    <!-- Filters -->
    <div class="d-flex gap-3 mb-3">
        <select class="form-select w-auto" onchange="applyFilters()">
            <option value="" {% if not selected_user_id %}selected{% endif %}>All Users</option>
            {% for u in users %}
            <option value="{{ u.UserID }}" {% if selected_user_id == u.UserID|string %}selected{% endif %}>
                {{ u.Name }}
            </option>
            {% endfor %}
        </select>

        <select class="form-select w-auto" onchange="applyFilters()">
            <option value="" {% if not selected_date %}selected{% endif %}>All Dates</option>
            {% for d in dates %}
            <option value="{{ d.Date }}" {% if selected_date == d.Date|string %}selected{% endif %}>
                {{ d.Date }}
            </option>
            {% endfor %}
        </select>
    </div>

    <!-- Workouts Table -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>WorkoutID</th>
                        <th>User</th>
                        <th>Date</th>
                        <th>Duration</th>
                        <th>Total Volume</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for w in workouts %}
                    <tr>
                        <td>{{ w.WorkoutID }}</td>
                        <td>{{ w.UserName }}</td>
                        <td>{{ w.Date }}</td>
                        <td>{{ w.TotalDuration }} min</td>
                        <td>{{ w.TotalVolume }}</td>
                        <td>
                            <a href="{{ url_for('workout_detail', user_id=w.UserID, date=w.Date) }}" 
                               class="btn btn-sm btn-outline-primary">View</a>

                            <form action="{{ url_for('delete_workout') }}" 
                                method="POST" class="d-inline">
                                <input type="hidden" name="user_id" value="{{ w.UserID }}">
                                <input type="hidden" name="date" value="{{ w.Date }}">
                                <button class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Delete this workout?')">
                                    Delete
                                </button>
                            </form>

                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
function applyFilters() {
    const userSelect = document.querySelectorAll('select')[0];
    const dateSelect = document.querySelectorAll('select')[1];
    const userId = userSelect.value;
    const date = dateSelect.value;
    
    let url = '{{ url_for("workouts") }}';
    const params = new URLSearchParams();
    
    if (userId) params.append('user_id', userId);
    if (date) params.append('date', date);
    
    const queryString = params.toString();
    if (queryString) {
        window.location.href = url + '?' + queryString;
    } else {
        window.location.href = url;
    }
}
</script>

{% endblock %}
